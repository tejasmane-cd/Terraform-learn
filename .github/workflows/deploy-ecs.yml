name: Build, push to ECR, deploy ECS

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  # Prefer GitHub Actions variables (Settings → Secrets and variables → Actions → Variables).
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
  ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub configuration
        run: |
          set -euo pipefail
          missing=0
          check() {
            name="$1"
            value="$2"
            kind="$3"
            if [ -z "${value}" ]; then
              echo "::error::Missing ${kind} '${name}'. Add it under Settings → Secrets and variables → Actions → ${kind}s."
              missing=1
            fi
          }
          check "AWS_ROLE_TO_ASSUME" "${{ secrets.AWS_ROLE_TO_ASSUME }}" "Secret"
          check "AWS_REGION" "${{ vars.AWS_REGION }}" "Variable"
          check "ECR_REPOSITORY" "${{ vars.ECR_REPOSITORY }}" "Variable"
          check "ECS_CLUSTER_NAME" "${{ vars.ECS_CLUSTER_NAME }}" "Variable"
          check "ECS_SERVICE_NAME" "${{ vars.ECS_SERVICE_NAME }}" "Variable"
          if [ "${missing}" -ne 0 ]; then
            echo ""
            echo "Fill values from terraform output, then create them in THIS repo (where the workflow runs):"
            echo "  Secret:  AWS_ROLE_TO_ASSUME"
            echo "  Variables: AWS_REGION, ECR_REPOSITORY, ECS_CLUSTER_NAME, ECS_SERVICE_NAME"
            echo "See .github/github-actions.env.example in the Terraform repo for a checklist."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${REGISTRY}"
          test -n "${ECR_REPOSITORY}"
          docker build -t "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" .
          docker tag "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" "${REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Force new ECS deployment
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${ECS_CLUSTER_NAME}" \
            --service "${ECS_SERVICE_NAME}" \
            --force-new-deployment
